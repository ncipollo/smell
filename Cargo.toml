[package]
name = "smell"
description = "CLI tool for static code analysis."
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ncipollo/smell"
version = "0.3.0"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
comfy-table = "7.2.2"
globset = "0.4.19"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.4", default-features = false, features = ["std", "parse", "serde"] }
tree-sitter = "0.26.11"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"

[dev-dependencies]
